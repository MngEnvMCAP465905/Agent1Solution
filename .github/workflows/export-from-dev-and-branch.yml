name: export-from-dev-and-branch

on:
  workflow_dispatch:
    inputs:
      solution-name:
        description: Solution name to export
        required: true
        default: Agent1Solution

permissions:
  contents: write

jobs:
  export-from-dev-and-branch:
    runs-on: windows-latest

    env:
      SOLUTION_NAME: ${{ inputs.solution-name }}
      ENVIRONMENT_URL: ${{ secrets.POWER_PLATFORM_ALM_DEMOS_DEV_ENVIRONMENT_URL }}
      CLIENT_ID: ${{ secrets.AZURE_ALM_DEMOS_DEV_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.AZURE_ALM_DEMOS_DEV_CLIENT_SECRET }}
      TENANT_ID: ${{ secrets.AZURE_ALM_DEMOS_DEV_TENANT_ID }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Validate connection
        uses: microsoft/powerplatform-actions/who-am-i@v1
        with:
          environment-url: ${{ env.ENVIRONMENT_URL }}
          app-id: ${{ env.CLIENT_ID }}
          client-secret: ${{ env.CLIENT_SECRET }}
          tenant-id: ${{ env.TENANT_ID }}

      - name: Export managed solution
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ env.ENVIRONMENT_URL }}
          app-id: ${{ env.CLIENT_ID }}
          client-secret: ${{ env.CLIENT_SECRET }}
          tenant-id: ${{ env.TENANT_ID }}
          solution-name: ${{ env.SOLUTION_NAME }}
          solution-output-file: out/exported/${{ env.SOLUTION_NAME }}_managed.zip
          managed: true
          overwrite: true
          
      - name: Upload the managed solution to the artifact store
        uses: actions/upload-artifact@v4
        with:
          name: managedSolutions
          path: out/exported/${{ env.SOLUTION_NAME }}_managed.zip
          
      - name: Export unmanaged solution
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ env.ENVIRONMENT_URL }}
          app-id: ${{ env.CLIENT_ID }}
          client-secret: ${{ env.CLIENT_SECRET }}
          tenant-id: ${{ env.TENANT_ID }}
          solution-name: ${{ env.SOLUTION_NAME }}
          solution-output-file: out/exported/${{ env.SOLUTION_NAME }}.zip
          overwrite: true

      - name: Unpack unmanaged solution
        uses: microsoft/powerplatform-actions/unpack-solution@v1
        with:
          solution-file: out/exported/${{ env.SOLUTION_NAME }}.zip
          solution-folder: ${{ env.SOLUTION_NAME }}/src
          solution-type: Unmanaged
          overwrite-files: true

      - name: Copy ZIPs to artifacts folder
        run: |
          mkdir "${{ env.SOLUTION_NAME }}\artifacts" -Force
          copy out\exported\*.zip "${{ env.SOLUTION_NAME }}\artifacts\"

      - name: Branch solution
        uses: microsoft/powerplatform-actions/branch-solution@v1
        with:
          solution-folder: ${{ env.SOLUTION_NAME }}
          solution-target-folder: ${{ env.SOLUTION_NAME }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          allow-empty-commit: true
