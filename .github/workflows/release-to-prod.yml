name: release-to-prod

on:
  workflow_dispatch:
    inputs:
      solution-name:
        required: true
        default: Agent1Solution
permissions:
  contents: write
  
jobs:
  release-to-prod:
    runs-on: windows-latest

    env:
      SOLUTION_NAME: ${{ inputs.solution-name }}
      ENVIRONMENT_URL: ${{ secrets.POWER_PLATFORM_ALM_DEMOS_DEV_ENVIRONMENT_URL }}
      CLIENT_ID: ${{ secrets.AZURE_ALM_DEMOS_DEV_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.AZURE_ALM_DEMOS_DEV_CLIENT_SECRET }}
      TENANT_ID: ${{ secrets.AZURE_ALM_DEMOS_DEV_TENANT_ID }}

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true
        
    - name: Install Power Platform Tools
      uses: microsoft/powerplatform-actions/actions-install@v1

    - name: Validate connection
      uses: microsoft/powerplatform-actions/who-am-i@v1
      with:
        environment-url: ${{ env.ENVIRONMENT_URL }}
        app-id: ${{ env.CLIENT_ID }}
        client-secret: ${{ env.CLIENT_SECRET }}
        tenant-id: ${{ env.TENANT_ID }}

    - name: Debug - list files
      run: dir artifacts

    - name: Import solution to destination environment
      uses: microsoft/powerplatform-actions/import-solution@v1
      with:
        environment-url: ${{ secrets.POWER_PLATFORM_ALM_DEMOS_GITHUB_ENVIRONMENT_URL }}
        app-id: ${{ secrets.AZURE_ALM_DEMOS_DEV_CLIENT_ID }}
        client-secret: ${{ secrets.AZURE_ALM_DEMOS_DEV_CLIENT_SECRET }}
        tenant-id: ${{ secrets.AZURE_ALM_DEMOS_DEV_TENANT_ID }}
        solution-file: artifacts/${{ inputs.solution-name }}_managed.zip
        force-overwrite: true
        publish-changes: true
