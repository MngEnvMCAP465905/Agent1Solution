name: build-and-deploy-to-prod

on:
  workflow_call:    
    inputs: 
      solution_name:
        description: 'name of the solution to worked on from Power Platform'
        type: string
        default: Agent1Solution     
    secrets:
      CLIENT_ID:
        required: true
      CLIENT_SECRET:
        required: true
      TENANT_ID:
        required: true
        
env:
  BUILD_ENVIRONMENT_URL: ${{ vars.BUILD_ENVIRONMENT_URL }}
  PROD_ENVIRONMENT_URL: ${{ vars.PROD_ENVIRONMENT_URL }}
  CLIENT_ID: ${{ secrets.CLIENT_ID }}
  CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
  TENANT_ID: ${{ secrets.TENANT_ID }}
  SOLUTION_SHIP_FOLDER: out/ship/
  SOLUTION_OUTBOUND_FOLDER: out/solutions/
  SOLUTION_SOURCE_FOLDER: solutions/
  SOLUTION_RELEASE_FOLDER: out/release/
  
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true
     
    - name: Install Power Platform tools
      uses: microsoft/powerplatform-actions/actions-install@v1

    - name: Validate connection
      uses: microsoft/powerplatform-actions/who-am-i@v1
      with:
        environment-url: ${{ env.BUILD_ENVIRONMENT_URL }}
        app-id: ${{ env.CLIENT_ID }}
        client-secret: ${{ env.CLIENT_SECRET }}
        tenant-id: ${{ env.TENANT_ID }}

    - name: Pack solution
      uses: microsoft/powerplatform-actions/pack-solution@v1
      with:
        solution-folder: ${{ env.SOLUTION_SOURCE_FOLDER }}/${{ inputs.solution_name }}
        solution-file: ${{ env.SOLUTION_OUTBOUND_FOLDER }}/${{ inputs.solution_name }}.zip
        solution-type: Unmanaged

    - name: Import solution as unmanaged to build environment
      uses: microsoft/powerplatform-actions/import-solution@v1
      with:
        environment-url: ${{env.BUILD_ENVIRONMENT_URL}}
        app-id: ${{env.CLIENT_ID}}
        client-secret: ${{ env.CLIENT_SECRET }}
        tenant-id: ${{env.TENANT_ID}}
        solution-file: ${{ env.SOLUTION_OUTBOUND_FOLDER }}/${{ inputs.solution_name }}.zip
        force-overwrite: true
        publish-changes: true

    - name: Export solution as managed
      uses: microsoft/powerplatform-actions/export-solution@v1
      with:
        environment-url: ${{env.BUILD_ENVIRONMENT_URL }}
        app-id: ${{ env.CLIENT_ID }}
        client-secret: ${{ env.CLIENT_SECRET }}
        tenant-id: ${{ env.TENANT_ID }}
        solution-name: ${{ inputs.solution_name }}
        managed: true
        solution-output-file: ${{ env.SOLUTION_SHIP_FOLDER }}/${{ inputs.solution_name }}_managed.zip

    - name: Upload the ready to ship solution to GH artifact store
      uses: actions/upload-artifact@v4
      with:
        name: managedSolutions
        path: ${{ env.SOLUTION_SHIP_FOLDER }}/

  release-to-staging:
    needs: [ build ]
    
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
      with:
        lfs: true
     
    - name: Install Power Platform tools
      uses: microsoft/powerplatform-actions/actions-install@v1    

    - name: Validate connection
      uses: microsoft/powerplatform-actions/who-am-i@v1
      with:
        environment-url: ${{env.PROD_ENVIRONMENT_URL}}
        app-id: ${{env.CLIENT_ID}}
        client-secret: ${{ env.CLIENT_SECRET }}
        tenant-id: ${{env.TENANT_ID}}

    - name: Fetch the ready to ship solution from GH artifact store
      uses: actions/download-artifact@v4
      with:
        name: managedSolutions
        path: ${{ env.SOLUTION_RELEASE_FOLDER }}
        
    - name: Import solution to prod env
      uses: microsoft/powerplatform-actions/import-solution@v1
      with:
        environment-url: ${{ env.PROD_ENVIRONMENT_URL }}
        app-id: ${{env.CLIENT_ID }}
        client-secret: ${{ secrets.CLIENT_SECRET }}
        tenant-id: ${{ env.TENANT_ID }}
        solution-file: ${{ env.SOLUTION_RELEASE_FOLDER }}/${{ inputs.solution_name }}_managed.zip
        force-overwrite: true
        publish-changes: true
